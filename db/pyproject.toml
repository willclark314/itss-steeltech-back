[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "steeltech-db"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
    "Flask-SQLAlchemy>=3.1.1",
    "Flask-Migrate>=4.1.0",
    "PyMySQL>=1.1.1",
    "cryptography>=42.0.0",
    "python-dotenv>=1.1.0",
    "openpyxl>=3.1.5",
]

[tool.setuptools.packages.find]
include = ["steeltech_db*"]
